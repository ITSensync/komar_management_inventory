openapi: 3.0.3
info:
  title: KOMAR RFID Inventory API
  version: 1.0.0
  description: API internal untuk registrasi tag RFID dan katalog produk gudang tunggal.
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: System
  - name: Products
  - name: RFID Tags
paths:
  /health:
    get:
      tags: [System]
      summary: Check API health
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/products:
    get:
      tags: [Products]
      summary: List products
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateInput'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ProductValidationError'
        '409':
          $ref: '#/components/responses/SkuConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/products/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Products]
      summary: Get a product
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Products]
      summary: Update a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateInput'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ProductValidationError'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '409':
          $ref: '#/components/responses/SkuConflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Products]
      summary: Delete an unused product
      description: Produk yang telah direferensikan lot, penerimaan, atau outbound harus diubah menjadi inactive, bukan dihapus.
      responses:
        '200':
          description: Product deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '409':
          description: Product is already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Product is already used. Set status to inactive instead.
        '500':
          $ref: '#/components/responses/InternalError'
  /api/rfid:
    get:
      tags: [RFID Tags]
      summary: List registered RFID tags
      responses:
        '200':
          description: RFID tag list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RfidTagListResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [RFID Tags]
      summary: Register scanned RFID tags
      description: UID dinormalisasi menjadi uppercase. UID duplikat tidak menggagalkan UID valid lain dalam submit yang sama.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RfidRegistrationRequest'
      responses:
        '201':
          description: At least one tag was registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RfidRegistrationResponse'
        '400':
          description: Invalid request or no valid UID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Every valid UID was already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RfidRegistrationResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/rfid/{id}:
    parameters:
      - $ref: '#/components/parameters/RfidTagId'
    get:
      tags: [RFID Tags]
      summary: Get an RFID tag
      responses:
        '200':
          description: RFID tag details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RfidTagResponse'
        '404':
          $ref: '#/components/responses/RfidTagNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [RFID Tags]
      summary: Delete an RFID tag
      responses:
        '200':
          description: RFID tag deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '404':
          $ref: '#/components/responses/RfidTagNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RfidTagId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Internal server error.
    ProductNotFound:
      description: Product was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Product not found.
    RfidTagNotFound:
      description: RFID tag was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: RFID tag not found.
    ProductValidationError:
      description: Product validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductValidationErrorResponse'
    SkuConflict:
      description: SKU is already registered
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: SKU is already registered.
  schemas:
    HealthResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          example: OK
        message:
          type: string
          example: Server is running
    Product:
      type: object
      required: [id, sku, name, base_unit, units_per_pack, min_outbound_units, expiry_required, status]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
          maxLength: 100
          example: SUSU-250
        name:
          type: string
          maxLength: 255
          example: Susu 250 ml
        base_unit:
          type: string
          example: pcs
        units_per_pack:
          type: integer
          minimum: 1
          example: 5
        min_outbound_units:
          type: integer
          minimum: 1
          description: Must be a multiple of units_per_pack.
          example: 5
        expiry_required:
          type: boolean
          example: true
        status:
          type: string
          enum: [active, inactive]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProductCreateInput:
      type: object
      required: [sku, name, units_per_pack, min_outbound_units]
      properties:
        sku:
          type: string
          example: SUSU-250
        name:
          type: string
          example: Susu 250 ml
        base_unit:
          type: string
          default: pcs
        units_per_pack:
          type: integer
          minimum: 1
          example: 5
        min_outbound_units:
          type: integer
          minimum: 1
          example: 5
        expiry_required:
          type: boolean
          default: false
        status:
          type: string
          enum: [active, inactive]
          default: active
    ProductUpdateInput:
      type: object
      minProperties: 1
      properties:
        sku:
          type: string
        name:
          type: string
        base_unit:
          type: string
        units_per_pack:
          type: integer
          minimum: 1
        min_outbound_units:
          type: integer
          minimum: 1
        expiry_required:
          type: boolean
        status:
          type: string
          enum: [active, inactive]
    ProductResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Product'
    ProductListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
    ProductValidationErrorResponse:
      type: object
      required: [success, message, errors]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Product validation failed.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: min_outbound_units
        message:
          type: string
          example: Must be a multiple of units_per_pack.
    RfidTag:
      type: object
      required: [id, rfid_number, status]
      properties:
        id:
          type: integer
          example: 1
        rfid_number:
          type: string
          example: E2806894000040168D432183
        status:
          type: string
          enum: [available, attached, detach_pending, detached, inspection, retired]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RfidTagResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/RfidTag'
    RfidTagListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/RfidTag'
    RfidRegistrationRequest:
      type: object
      required: [rfid_tags]
      properties:
        rfid_tags:
          type: array
          minItems: 1
          items:
            type: string
          example: [E2806894000040168D432183, E2806894000040168D43218C]
    RfidRegistrationResponse:
      type: object
      required: [success, total_requested, total_inserted, total_errors, results, errors]
      properties:
        success:
          type: boolean
          example: true
        total_requested:
          type: integer
          example: 2
        total_inserted:
          type: integer
          example: 1
        total_errors:
          type: integer
          example: 1
        results:
          type: array
          items:
            $ref: '#/components/schemas/RfidRegistrationResult'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/RfidRegistrationError'
    RfidRegistrationResult:
      type: object
      required: [index, rfid_number, id, status]
      properties:
        index:
          type: integer
          example: 0
        rfid_number:
          type: string
          example: E2806894000040168D432183
        id:
          type: integer
          example: 1
        status:
          type: string
          example: available
    RfidRegistrationError:
      type: object
      required: [index, rfid_number, code, message]
      properties:
        index:
          type: integer
          example: 1
        rfid_number:
          type: string
          example: E2806894000040168D432183
        code:
          type: string
          enum: [invalid_uid, duplicate_in_request, already_registered]
        message:
          type: string
    SuccessMessage:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
